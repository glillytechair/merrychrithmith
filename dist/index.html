    function win() {

            save(STORE_TIME, String(Math.round(G.t)));

        endRun();
    }
    function award(base, x, y, label) {
        const now = G.t;
        const mult = multiplier();
        let gain = base * mult;
        let tag = label + ' +' + gain + (mult > 1 ? ' ×' + mult : '');
        if (now - G.lastCatchAt < DOUBLE_WINDOW_MS / 1000) {
            // two things at once: this one is doubled, and so, retroactively, is the previous one
            gain = gain * 2 + G.lastCatchXP;
            tag = 'TWO THINGS AT ONCE ×2 +' + gain;
            SFX.double();
            unlock('two');
            G.lastCatchAt = -1e9;
        }
        else {
            G.lastCatchAt = now;
            G.lastCatchXP = gain;
        }
        gainXP(gain, tag, x, y);
    }
    /** Adds XP with the usual fanfare: floater, flyer into the counter, level ding, and the perfect-day check. */
    function gainXP(gain, tag, x, y) {
        const before = G.xp;
        G.xp = Math.min(PERFECT_DAY, G.xp + gain);
        floater(tag, x, y);
        flyer('+' + gain, x, y);
        const lvl = Math.floor(G.xp / XP_PER_LEVEL);
        if (lvl > G.level && G.xp < PERFECT_DAY) {
            G.level = lvl;
            const r = portraitRect();
            floater('Ding. Level ' + lvl + '.', r.x + r.w * HEAD_CX, r.y - stackHeight() - 40, 2);
            SFX.ding();
            setStatus('You have gained a level. Welcome to level ' + lvl + '.', 3);
        }
        if (G.xp >= PERFECT_DAY && before < PERFECT_DAY) {
            G.level = 10;
            win();
        }
    }
    function bumpStorm() {
        G.storm++;

        }
        else if (G.storm > 0 && G.storm % 10 === 0)
            floater('STORM ' + G.storm, PLAY_W - 90, 70, 2);
    }
    function catchGood(it) {

        SFX.blip(G.storm);
        if (it.rare)
            SFX.rare();
        award(KINDS[it.kind].xp * (it.rare ? RARE_CARD_MULT : 1), it.x + it.w / 2, it.y, it.rare ? 'RARE' : KINDS[it.kind].label);
        if (it.rare)
            unlock('rare');
        const n = (G.catches[it.kind] = (G.catches[it.kind] ?? 0) + 1);
        if (it.kind === 'pellegrino' && n >= ACH_NEED.hydrated)
            unlock('hydrated');
        if (it.kind === 'card' && n >= ACH_NEED.card)
            unlock('card');
        if (it.kind === 'heart' && n >= ACH_NEED.heart)
            unlock('heart');
        if (it.kind === 'steak' && n >= ACH_NEED.steak)
            unlock('steak');
    }
    function landOnHead() {
        G.stack++;
        G.wreathsOnHead++;
        G.caught++;
        G.landFx = LAND_FX;
        bumpStorm();
        SFX.wreath();
        const r = portraitRect();
        award(XP_WREATH, r.x + r.w * HEAD_CX, r.y - stackHeight() - 10, 'ON HEAD');
        unlock('literal');
        if (G.stack === 5) {
            unlock('stack5');
            gainXP(STACK_BONUS, 'LOAD-BEARING +' + STACK_BONUS, r.x + r.w * HEAD_CX, r.y - stackHeight() - 34);
        }
    }
    /** Where a point sits across the head zone: -1 at its left edge, 0 under the center of the stack, 1 at its right edge. */
    function stackOffset(cx, P) {
        const headL = P.x + HEAD_L * P.w, headR = P.x + HEAD_R * P.w;
        return (cx - (headL + headR) / 2) / ((headR - headL) / 2);
    }
    function bounceOff(it, dir) {
        // Near the stack but not on it: the wreath hops away and falls clear. No border, no undo.
        it.bounced = true;
        it.passedHead = true;
        it.vx = dir * 260;
        it.vy = -Math.max(120, it.vy * 0.5);
        SFX.bounce(); // no words for a miss; the hop says it
    }
    function loseUndo(cause, msg) {
        G.undos--;

        setStatus(G.undos > 0 ? 'Undo used. ' + G.undos + ' left.' : 'No undos left.', 3);

    }
    function catchBad(it) { loseUndo(it.kind, pick(KINDS[it.kind].bad)); }
    function borderFail() {

        loseUndo('border', pick(BORDER_MSGS));

    // ============================================================================
    //  Spawning
    // ============================================================================
    function spawnOne(x, kind) {
        const d = difficulty();
        if (!kind) {
            if (G.spawnCount === 0)
                kind = 'wreath';
            else if (G.spawnCount === 1)
                kind = 'pellegrino';
            else if (Math.random() < lerp(BAD_START, BAD_END, d))
                kind = pick(BAD_KINDS);
            else if (Math.random() < WREATH_SHARE)
                kind = 'wreath';
            else
                kind = Math.random() < 0.14 ? 'steak' : pick(['pellegrino', 'card', 'heart']);
        }
        const rare = kind === 'card' && Math.random() < RARE_CARD_SHARE;
        const s = rare ? rareCard : SPRITES[kind];
        const w = s.width, h = s.height;
        if (x === null)
            x = 16 + Math.random() * (PLAY_W - 32 - w);
        const it = { kind, x: clamp(x, 8, PLAY_W - 8 - w), y: -h - 4, w, h, vy: lerp(FALL_START, FALL_END, d) * (0.85 + Math.random() * 0.3), wob: Math.random() * 7, passedHead: false, rare };
        if (G.spawnCount === 0) {
            const r = portraitRect();
            it.x = r.x + r.w * HEAD_CX - w / 2;
            it.vy = FALL_START;
        }
        G.items.push(it);
        G.spawnCount++;
        return it;
    }
    function spawn() {
        const d = difficulty();
        const first = spawnOne(null);
        if (G.spawnCount > 2 && Math.random() < lerp(PAIR_START, PAIR_END, d)) {
            const side = Math.random() < 0.5 ? -1 : 1;
            const second = spawnOne(first.x + side * (110 + Math.random() * 60));
            second.y -= Math.random() * 30;
            second.vy = first.vy;
        }
    }
    // ============================================================================
    //  Update
    // ============================================================================
    function update(dt) {
        // timers that run in every phase
        if (G.statusT > 0)
            G.statusT -= dt;
        if (G.banner) {
            G.banner.t += dt;
            if (G.banner.t > G.banner.life)
                G.banner = null;
        }
        for (const f of G.floaters)
            f.t += dt;
        G.floaters = G.floaters.filter(f => f.t < f.life);
        for (const f of G.flyers)
            f.t += dt;
        if (G.flyers.some(f => f.t >= f.life))
            G.xpFlash = 0.14; // the XP counter blinks as the points arrive
        G.flyers = G.flyers.filter(f => f.t < f.life);
        if (G.xpFlash > 0)
            G.xpFlash = Math.max(0, G.xpFlash - dt);
        if (G.landFx > 0)
            G.landFx = Math.max(0, G.landFx - dt);
        if (G.achQueue.length) {
            G.achT += dt;
            if (G.achT > 2.6 + BANNER_LINGER) {
                G.achQueue.shift();
                G.achT = 0;
            }
        }
        if (G.achQueue.length && G.achQueue[0] !== lastAchSound) {
            lastAchSound = G.achQueue[0];
            SFX.ach();
        }
        if (G.borderFx > 0)
            G.borderFx = Math.max(0, G.borderFx - dt / 0.9);
        if (G.infFx > 0)
            G.infFx = Math.max(0, G.infFx - dt);
        if (G.shakeFx > 0)
            G.shakeFx = Math.max(0, G.shakeFx - dt);
        if (G.phase === 'dying') {
            G.dyingT -= dt;
            if (G.dyingT <= 0)
                G.phase = 'over';
            return;
        }
        if (G.phase !== 'playing' || G.paused)
            return;
        G.t += dt;
        // movement
        if (G.bot)
            botThink();
        if (G.keys.left !== G.keys.right) {
            G.usingKeys = true;
            G.px = clamp(G.px + (G.keys.right ? 1 : -1) * KEY_SPEED * dt, 0, maxPX());
            G.targetX = G.px;
        }
        else if (!G.usingKeys) {
            const want = clamp(G.targetX, 0, maxPX());
            const step = MOUSE_SPEED * dt;
            G.px = clamp(G.px + clamp(want - G.px, -step, step), 0, maxPX());
        }
        // spawning
        G.spawnTimer -= dt;
        if (G.spawnTimer <= 0) {
            spawn();
            G.spawnTimer = lerp(SPAWN_START, SPAWN_END, difficulty()) * warmup() * (0.8 + Math.random() * 0.4);
        }
        // items
        const P = portraitRect();
        const headLine = P.y - stackHeight();
        const keep = [];
        for (const it of G.items) {
            it.y += it.vy * dt;
            it.wob += dt;
            if (it.bounced) {
                it.x += (it.vx ?? 0) * dt;
                it.vy += 900 * dt;
            } // a bounced wreath arcs away under gravity
            const cx = it.x + it.w / 2, bottom = it.y + it.h;
            let done = false;
            if (it.kind === 'wreath') {
                if (!it.passedHead && bottom >= headLine) {
                    const off = stackOffset(cx, P); // -1..1 across the head zone, 0 is the center of the stack
                    if (bottom <= headLine + 42 && Math.abs(off) <= PERFECT_ZONE) {
                        landOnHead();
                        done = true;
                    }
                    else if (bottom <= headLine + 42 && Math.abs(off) <= 1 + EDGE_SLOP)
                        bounceOff(it, off < 0 ? -1 : 1);
                    else if (bottom > headLine + 42)
                        it.passedHead = true;
                }
                if (!done && !it.bounced && bottom >= P.y + SHOULDER * P.h && cx >= P.x + 10 && cx <= P.x + P.w - 10 && it.y < P.y + P.h) {
                    borderFail();
                    done = true;
                }
            }
            else if (!it.passedHead && bottom >= P.y) {
                // Things land on the portrait, or they don't. Once past the top band they are simply falling beside it.
                const ix = it.x + 5, iw = it.w - 10;
                const good = KINDS[it.kind].good;
                const inset = good ? 0 : BAD_INSET; // good things are caught generously; bad things must hit the body
                if (bottom <= P.y + CATCH_BAND && ix < P.x + P.w - inset && ix + iw > P.x + inset) {
                    if (good)
                        catchGood(it);
                    else
                        catchBad(it);
                    done = true;
                }
                else if (bottom > P.y + CATCH_BAND)
                    it.passedHead = true;
            }
            if (G.phase !== 'playing') {
                if (!done)
                    keep.push(it);
                continue;
            } // a win or death froze the field
            if (done)
                continue;
            if (it.y > PLAY_H + 4) {
                if (!KINDS[it.kind].good) {
                    G.dodged++;
                    const n = (G.dodges[it.kind] = (G.dodges[it.kind] ?? 0) + 1);
                    if (it.kind === 'sugar' && n >= ACH_NEED.sugar)
                        unlock('sugar');
                }
                continue;
            }
            keep.push(it);
        }
        G.items = keep;
    }
    /** A crude auto-player, only for tuning. Enabled with #bot in the URL; skill 0..1. */
    function botThink() {
        const P = portraitRect();
        const skill = G.botSkill;
        const horizon = 0.5 + skill * 0.9; // weaker players look less far ahead
        let bestX = G.px, bestCost = Infinity;
        const margin = 6 + skill * 14; // better players keep a little distance from bad things
        for (let x = 0; x <= maxPX(); x += 8) {
            let cost = Math.abs(x - G.px) * 0.004;
            for (const it of G.items) {
                const eta = (P.y - (it.y + it.h)) / it.vy;
                if (eta > horizon)
                    continue; // not worth thinking about yet
                if (it.kind === 'wreath' ? it.y > P.y + P.h : it.y + it.h > P.y + CATCH_BAND)
                    continue; // gone past
                const soon = 1 / (0.2 + Math.max(0, eta));
                const cx = it.x + it.w / 2;
                if (it.kind === 'wreath') {
                    if (eta >= 0 && cx >= x + HEAD_L * P.w && cx <= x + HEAD_R * P.w)
                        cost -= 3 * soon;
                    else if (cx > x + 10 - margin && cx < x + P.w - 10 + margin)
                        cost += 12 * soon;
                }
                else if (KINDS[it.kind].good) {
                    if (it.x + it.w - 5 > x && it.x + 5 < x + P.w)
                        cost -= soon;
                }
                else if (it.x + it.w - 5 > x + BAD_INSET - margin && it.x + 5 < x + P.w - BAD_INSET + margin)
                    cost += 12 * soon;
            }
            if (cost < bestCost) {
                bestCost = cost;
                bestX = x;
            }
        }
        G.usingKeys = false;
        G.targetX = clamp(bestX + (Math.random() - 0.5) * (8 + (1 - skill) * 100), 0, maxPX());
    }
    // ============================================================================
    //  Rendering
    // ============================================================================
    function marquee(g, x, y, w, h, phase) {
        g.fillStyle = WHITE;
        g.fillRect(x, y, w, 1);
        g.fillRect(x, y + h - 1, w, 1);
        g.fillRect(x, y, 1, h);
        g.fillRect(x + w - 1, y, 1, h);
        g.fillStyle = BLACK;
        const seg = 4, per = w * 2 + h * 2;
        for (let s = (phase % (seg * 2)); s < per; s += seg * 2) {
            for (let k = 0; k < seg; k++) {
                const d = s + k;
                if (d >= per)
                    break;
                let px, py;
                if (d < w) {
                    px = x + d;
                    py = y;
                }
                else if (d < w + h) {
                    px = x + w - 1;
                    py = y + d - w;
                }
                else if (d < w * 2 + h) {
                    px = x + w - 1 - (d - w - h);
                    py = y + h - 1;
                }
                else {
                    px = x;
                    py = y + h - 1 - (d - w * 2 - h);
                }
                g.fillRect(px, py, 1, 1);
            }
        }
    }
    function dialogBox(g, x, y, w, h) {
        g.fillStyle = WHITE;
        g.fillRect(x, y, w, h);
        g.fillStyle = BLACK;
        g.fillRect(x, y, w, 3);
        g.fillRect(x, y + h - 3, w, 3);
        g.fillRect(x, y, 3, h);
        g.fillRect(x + w - 3, y, 3, h);
        g.fillRect(x + 6, y + 6, w - 12, 1);
        g.fillRect(x + 6, y + h - 7, w - 12, 1);
        g.fillRect(x + 6, y + 6, 1, h - 12);
        g.fillRect(x + w - 7, y + 6, 1, h - 12);
    }
    function button(g, id, label, x, y, w, h) {
        buttons.push({ id, label, x, y, w, h });
        const hot = G.hover === id;
        g.fillStyle = hot ? BLACK : WHITE;
        g.fillRect(x, y, w, h);
        g.fillStyle = BLACK;
        g.fillRect(x, y, w, 2);
        g.fillRect(x, y + h - 2, w, 2);
        g.fillRect(x, y, 2, h);
        g.fillRect(x + w - 2, y, 2, h);
        text(g, label, x + w / 2, y + (h - 14) / 2, 2, hot ? WHITE : BLACK, 'center');

    function hollowRect(g, x, y, w, h, t) {
        g.fillRect(x, y, w, t);
        g.fillRect(x, y + h - t, w, t);
        g.fillRect(x, y, t, h);
        g.fillRect(x + w - t, y, t, h);

    function sparkle(g, x, y, t, sx = 1, sy = 1, glints = 2, lit = 0.28) {
        // Glints hop from berry to berry on a wreath drawn at (x, y); each is lit for the `lit` share of its cycle.
        const cx = 9, cy = 9, rad = 5.9, half = Math.floor(SPR / 2); // ring geometry must match wreathRows()
        for (let k = 0; k < glints; k++) {
            const ph = t * 0.9 + k / glints, cyc = ph % 1;
            if (cyc > lit)
                continue;
            const slot = (Math.floor(ph) * 2 + k * 2) % 6;
            const a = (slot + 0.5) * Math.PI / 3;
            const px = Math.round(x + (cx + Math.cos(a) * rad) * SPR * sx), py = Math.round(y + (cy + Math.sin(a) * rad) * SPR * sy);
            const arm = cyc < 0.12 ? 2 : 1;

    function drawItem(g, it) {
        const bad = !KINDS[it.kind].good;
        const dx = bad ? Math.round(Math.sin(it.wob * 28) * 3) : 0;
        const x = Math.round(it.x + dx), y = Math.round(it.y);
        g.drawImage(it.rare ? rareCard : SPRITES[it.kind], x, y);
        if (it.kind === 'wreath')
            sparkle(g, x, y, it.wob, 1, 1, 3, 0.4); // falling wreaths sparkle a little more than the stack
    }
    function drawPortrait(g, tNow) {
        const P = portraitRect();
        const sx = G.shakeFx > 0 ? Math.round((Math.random() - 0.5) * 6) : 0;
        const x = P.x + sx, y = P.y;
        g.drawImage(portrait, x, y);
        // wreaths that landed, stacked, squashed into perspective
        const n = Math.min(G.stack, 14), ww = Math.round(P.w * 0.56), wh = 34;
        const wx = Math.round(x + P.w * HEAD_CX - ww / 2);
        for (let i = 0; i < n; i++)
            g.drawImage(SPRITES.wreath, wx, y - 16 - i * 12, ww, wh);
        if (n > 0)
            sparkle(g, wx, y - 16 - (n - 1) * 12, tNow / 1000, ww / SPRITES.wreath.width, wh / SPRITES.wreath.height);
        if (G.stack > 14)
            textHalo(g, '×' + G.stack, x + P.w * HEAD_CX, y - 16 - 14 * 12 - 20, 2, BLACK, 'center');
        if (G.phase === 'playing' || G.phase === 'won')
            marquee(g, x - 2, y - 2, P.w + 4, P.h + 4, Math.floor(tNow / 90));

            // hollow until a falling wreath is lined up with the stack, then solid.
            const incoming = G.items.find(i => i.kind === 'wreath' && !i.bounced && !i.passedHead);

                const half = (HEAD_R - HEAD_L) / 2 * P.w * PERFECT_ZONE, mid = x + (HEAD_L + HEAD_R) / 2 * P.w;
                const lined = !!incoming && Math.abs(stackOffset(incoming.x + incoming.w / 2, P)) <= PERFECT_ZONE;
                const hy = y - stackHeight() - 8;
                for (const hx of [mid - half, mid + half]) {
                    g.fillStyle = BLACK;
                    g.fillRect(Math.round(hx) - 4, hy - 4, 8, 8);
                    if (!lined) {
                        g.fillStyle = WHITE;
                        g.fillRect(Math.round(hx) - 2, hy - 2, 4, 4);
                    }
                }
            }
        }
        if (G.landFx > 0) {
            // a wreath just landed: the drawing goes black and white for a moment, then the selection border blinks
            if (G.landFx > LAND_FX - 0.1) {
                g.save();
                g.beginPath();
                g.rect(x, y, P.w, P.h);
                g.clip();
                g.globalCompositeOperation = 'saturation';
                g.fillStyle = DARK;
                g.fillRect(x, y, P.w, P.h); // keeps the light and dark, drops the color
                g.restore();
            }
            if (Math.floor(G.landFx * 20) & 1) {
                g.fillStyle = WHITE;
                hollowRect(g, x - 5, y - 5, P.w + 10, P.h + 10, 3);
                g.fillStyle = BLACK;
                hollowRect(g, x - 8, y - 8, P.w + 16, P.h + 16, 3);
            }
        }
        if (G.borderFx > 0) {
            const k = 1 - G.borderFx, grow = 1 + k * 0.08;
            const bw = (P.w + 40) * grow, bh = (P.h + 40) * grow;
            g.drawImage(SPRITES.wreath, Math.round(x + P.w / 2 - bw / 2), Math.round(y + P.h / 2 - bh / 2 + 8), Math.round(bw), Math.round(bh));
        }
    }
    function drawHUD(g) {

            g.fillRect(8, 6, textW(xpStr, 2) + 8, 22);
            text(g, xpStr, 12, 10, 2, WHITE);
        }
        else
            text(g, xpStr, 12, 10, 2, BLACK);
        text(g, 'LEVEL ' + G.level, 12, 30, 2, DARK);

        g.fillStyle = BLACK;
        g.fillRect(12, 48, 162, 8);
        g.fillStyle = WHITE;
        g.fillRect(13, 49, 160, 6);
        g.fillStyle = BLACK;
        g.fillRect(13, 49, Math.round(160 * G.xp / PERFECT_DAY), 6);

        const infinite = G.storm >= STORM_X3;
        const stormStr = infinite ? 'INFINITE  ×' + mult : 'STORM ' + G.storm + '  ×' + mult;

        const lit = infinite && (G.infFx <= 0 || (Math.floor(G.infFx * 8) & 1) === 0);
        if (lit) {
            const sw = textW(stormStr, 2);
            g.fillStyle = BLACK;
            g.fillRect(PLAY_W - 12 - sw - 4, 6, sw + 8, 22);

        }

            text(g, stormStr, PLAY_W - 12, 10, 2, BLACK, 'right');

        else
            text(g, STORM_X3 + ' FOR INFINITE', PLAY_W - 12, 30, 2, DARK, 'right'); // and until then, what it takes

    }
    function drawFloaters(g) {
        for (const f of G.floaters) {
            const k = f.t / f.life;
            const y = f.y - k * 46;
            g.globalAlpha = k < 0.55 ? 1 : Math.max(0, 1 - (k - 0.55) / 0.45); // a smooth fade out, no flicker
            textHalo(g, f.text, clamp(f.x, 60, PLAY_W - 60), y, f.scale, BLACK, 'center');
        }
        g.globalAlpha = 1;
        for (const f of G.flyers) {
            // a small +N on a quadratic arc from the catch to the XP counter, eased so it leaves slowly and arrives quickly
            const k = f.t / f.life, e = k * k;
            const mx = (f.x0 + f.x1) / 2, my = Math.min(f.y0, f.y1) - 70;
            const x = (1 - e) * (1 - e) * f.x0 + 2 * (1 - e) * e * mx + e * e * f.x1;
            const y = (1 - e) * (1 - e) * f.y0 + 2 * (1 - e) * e * my + e * e * f.y1;
            textHalo(g, f.text, x, y, 2, BLACK, 'center');
        }
    }
    function drawBanner(g) {
        if (!G.banner)
            return;
        const lines = wrap(G.banner.text, 560, 2);
        const w = Math.max(...lines.map(l => textW(l, 2))) + 40, h = lines.length * 20 + 20;
        const x = Math.round(PLAY_W / 2 - w / 2), y = 118;
        g.fillStyle = WHITE;
        g.fillRect(x, y, w, h);
        g.fillStyle = BLACK;
        g.fillRect(x, y, w, 2);
        g.fillRect(x, y + h - 2, w, 2);
        g.fillRect(x, y, 2, h);
        g.fillRect(x + w - 2, y, 2, h);
        lines.forEach((l, i) => text(g, l, PLAY_W / 2, y + 10 + i * 20, 2, BLACK, 'center'));
    }
    function drawPhoto(g, x, y, w, h) {
        if (!photo)
            return;
        const sm = g.imageSmoothingEnabled;
        g.imageSmoothingEnabled = true; // a photograph, not pixel art
        g.drawImage(photo, x, y, w, h);
        g.imageSmoothingEnabled = sm;
    }
    function drawAchDialog(g) {
        buttons.length = 0; // while this is up, only its own button is live
        const w = 780, h = 572, x = (PLAY_W - w) / 2, y = 14;
        dialogBox(g, x, y, w, h);
        text(g, 'ACHIEVEMENTS', PLAY_W / 2, y + 14, 3, BLACK, 'center');
        text(g, everAch.size + ' of ' + ACH_TOTAL + ' earned', PLAY_W / 2, y + 40, 2, DARK, 'center');
        let cy = y + 66;
        for (const id of Object.keys(ACH)) {
            const got = everAch.has(id);
            text(g, (got ? '✓ ' : '  ') + ACH[id], x + 30, cy, 2, got ? BLACK : DARK);
            if (got)
                text(g, ACH_HOW[id], x + 436, cy, 2, DARK); // how it was done, only once it has been
            cy += 20;
        }
        // the photo: an empty frame until every achievement has been earned
        const ph = 170, pw = photo ? Math.round(ph * photo.naturalWidth / photo.naturalHeight) : 206;
        const px = Math.round(PLAY_W / 2 - pw / 2), py = cy + 12;
        g.fillStyle = BLACK;
        g.fillRect(px - 2, py - 2, pw + 4, ph + 4);
        if (everAch.size >= ACH_TOTAL && photo) {
            drawPhoto(g, px, py, pw, ph);
            text(g, 'Perfect day. Wolf form.', PLAY_W / 2, py + ph + 10, 2, DARK, 'center');
        }
        else {
            g.fillStyle = WHITE;
            g.fillRect(px, py, pw, ph);
            g.fillStyle = LIGHT;
            for (let yy = py; yy < py + ph; yy++)
                for (let xx = px + (yy & 1); xx < px + pw; xx += 2)
                    g.fillRect(xx, yy, 1, 1);
            textHalo(g, 'Locked', PLAY_W / 2, py + ph / 2 - 7, 2, BLACK, 'center');
            text(g, 'All ' + ACH_TOTAL + ' achievements to unlock.', PLAY_W / 2, py + ph + 10, 2, DARK, 'center');
        }
        button(g, 'achclose', 'Close', x + w - 180, y + h - 44, 150, 30);
    }
    function drawAchievement(g) {
        if (!G.achQueue.length)
            return;
        const name = ACH[G.achQueue[0]];
        const t = G.achT;
        const slide = t < 0.25 ? 1 - t / 0.25 : t > 2.3 + BANNER_LINGER ? (t - 2.3 - BANNER_LINGER) / 0.3 : 0;
        const w = Math.max(textW('ACHIEVEMENT UNLOCKED', 2), textW(name, 2)) + 76, h = 52;
        const x = Math.round(PLAY_W - 12 - w + slide * (w + 24)), y = 52; // top right, under the storm box; slides in from the edge
        g.fillStyle = BLACK;
        g.fillRect(x, y, w, h);
        g.fillStyle = WHITE;
        g.fillRect(x + 2, y + 2, w - 4, h - 4);
        g.fillStyle = BLACK;
        g.fillRect(x + 4, y + 4, w - 8, h - 8);
        // badge
        const p = new Pix(g, x + 12, y + 10);
        for (let r = 0; r <= 14; r++)
            p.ellipse(15, 15, r, r, WHITE);
        p.line(8, 15, 13, 20, BLACK);
        p.line(9, 15, 14, 20, BLACK);
        p.line(13, 20, 22, 9, BLACK);
        p.line(14, 20, 23, 9, BLACK);
        text(g, 'ACHIEVEMENT UNLOCKED', x + 56, y + 10, 2, LIGHT);
        text(g, name, x + 56, y + 28, 2, WHITE);
    }
    function drawEndDialog(g) {
        const won = G.phase === 'won';
        const w = 680, x = (PLAY_W - w) / 2;
        // measure first, so the box fits its contents
        const deathLines = won ? [] : wrap(G.deathMsg, w - 60, 2);
        const achList = G.runAch.slice(0, 11);
        const more = G.runAch.length - achList.length;
        const noteLines = wrap(PERSONAL_NOTE, w - 84, 2).slice(0, 4);
        const creditLines = wrap(ART_CREDIT, w - 60, 2).slice(0, 2);
        const headH = won ? 54 + 22 + 26 : deathLines.length * 20 + 6 + 20 + 26;
        const listRows = Math.max(1, achList.length + (more > 0 ? 1 : 0));
        const noteH = noteLines.length * 18 + 20;
        const h = 22 + headH + 22 + listRows * 16 + 14 + noteH + 8 + creditLines.length * 16 + 58;
        const y = Math.round((PLAY_H - h) / 2);
        dialogBox(g, x, y, w, h);
        let cy = y + 22;
        if (won) {
            text(g, 'Indeed.', PLAY_W / 2, cy, 6, BLACK, 'center');
            cy += 54;
            text(g, 'A perfect day. ' + PERFECT_DAY + ' XP in ' + fmtTime(G.finishTime) + '.', PLAY_W / 2, cy, 2, BLACK, 'center');
            cy += 22;
            if (bestTime)
                text(g, 'Best time: ' + fmtTime(bestTime), PLAY_W / 2, cy, 2, DARK, 'center');
            cy += 26;
        }
        else {
            deathLines.forEach(l => { text(g, l, PLAY_W / 2, cy, 2, BLACK, 'center'); cy += 20; });
            cy += 6;
            text(g, 'XP ' + G.xp + ' / ' + PERFECT_DAY + '   LEVEL ' + G.level + '   ' + fmtTime(G.t), PLAY_W / 2, cy, 2, BLACK, 'center');
            cy += 20;
            text(g, 'Best: ' + bestXP + ' XP', PLAY_W / 2, cy, 2, DARK, 'center');
            cy += 26;
        }
        text(g, 'ACHIEVEMENTS THIS RUN: ' + G.runAch.length + '   (' + everAch.size + '/' + ACH_TOTAL + ' ever)', x + 30, cy, 2, BLACK);
        cy += 22;
        if (!achList.length)
            text(g, 'None. Which is itself notable.', x + 30, cy, 2, DARK);
        achList.forEach((id, i) => text(g, '✓ ' + ACH[id], x + 30, cy + i * 16, 2, BLACK));
        if (more > 0)
            text(g, '  and ' + more + ' more.', x + 30, cy + achList.length * 16, 2, DARK);
        cy += listRows * 16 + 14;
        // the personal note
        g.fillStyle = BLACK;
        g.fillRect(x + 30, cy, w - 60, noteH);
        g.fillStyle = WHITE;
        g.fillRect(x + 31, cy + 1, w - 62, noteH - 2);
        noteLines.forEach((l, i) => text(g, l, PLAY_W / 2, cy + 10 + i * 18, 2, BLACK, 'center'));
        cy += noteH + 8;
        creditLines.forEach((l, i) => text(g, l, PLAY_W / 2, cy + i * 16, 2, DARK, 'center'));
        // Sierra buttons
        const by = y + h - 48;
        button(g, 'restore', 'Restore', x + 50, by, 150, 30);
        button(g, 'restart', 'Restart', x + w / 2 - 75, by, 150, 30);
        button(g, 'quit', 'Quit', x + w - 200, by, 150, 30);
    }
    function drawHowto(g) {
        const w = 700, h = 494, x = (PLAY_W - w) / 2, y = (PLAY_H - h) / 2;
        dialogBox(g, x, y, w, h);
        let cy = y + 18;
        text(g, 'WREATH QUEST', PLAY_W / 2, cy, 3, BLACK, 'center');
        cy += 28;
        text(g, 'Quest for the Head', PLAY_W / 2, cy, 2, DARK, 'center');
        cy += 30;
        const legend = (title, lx, kinds) => {
            text(g, title, lx, cy, 2, BLACK);
            cy += 22;
            for (const k of kinds) {
                const s = SPRITES[k];
                g.drawImage(s, Math.round(lx + 30 - s.width / 2), Math.round(cy + 20 - s.height / 2));
                text(g, KINDS[k].label, lx + 70, cy + 13, 2, BLACK);
                cy += 50;
            }
        };
        const top = cy;
        legend('CATCH', x + 50, ['wreath', 'pellegrino', 'card', 'heart', 'steak']);
        cy = top;
        legend('AVOID', x + w / 2 + 30, ['beach', 'dasani', 'counterspell', 'comforter', 'sugar']);
        cy += 6;
        for (const l of ['Mouse, ← →, or A and D. P pauses. M mutes.', 'One minute is one XP.', PERFECT_DAY + ' XP is a perfect day.', 'Two things at once is double XP.']) {
            text(g, l, PLAY_W / 2, cy, 2, BLACK, 'center');
            cy += 18;
        }
        button(g, 'begin', 'Begin', PLAY_W / 2 - 75, y + h - 50, 150, 30);
    }
    function drawTitle(g) {
        g.drawImage(titleArt, 0, 0);
        const y0 = titleArt.height;
        g.fillStyle = WHITE;
        g.fillRect(0, y0, PLAY_W, PLAY_H - y0);
        text(g, 'WREATH QUEST', PLAY_W / 2, y0 + 14, 4, BLACK, 'center');
        text(g, 'Quest for the Head', PLAY_W / 2, y0 + 50, 2, DARK, 'center');
        if (Math.floor(performance.now() / 500) & 1)
            text(g, 'Click, or press Space.', PLAY_W / 2, y0 + 84, 2, BLACK, 'center');
        const best = bestXP ? 'Best: ' + bestXP + ' XP' + (bestTime ? '   Best perfect day: ' + fmtTime(bestTime) : '') : '';
        const lines = wrap(best || ART_CREDIT, PLAY_W - 60, 2);
        lines.forEach((l, i) => text(g, l, PLAY_W / 2, y0 + 112 + i * 16, 2, DARK, 'center'));
    }
    function render(tNow) {
        buttons = [];
        ctx.drawImage(chrome, 0, 0);
        const soundMenu = menuRects.find(m => m.label === 'Sound');
        text(ctx, soundOn ? 'Sound' : 'Sound: off', soundMenu.x + 6, FRAME + TITLE_H + 4, 2, soundOn ? BLACK : DARK);
        // status bar text
        const sy = STATUS_Y + 6;
        const defaultStatus = G.phase === 'playing' ? 'Wreaths go on the head.' : 'For Help, click Help.';
        ctx.save();
        ctx.beginPath();
        ctx.rect(FRAME + 4, sy - 2, WIN_W - 310 - FRAME, STATUS_H - 6);
        ctx.clip(); // each pane clips its own text
        text(ctx, G.statusT > 0 ? G.status : defaultStatus, FRAME + 8, sy, 2, BLACK);
        ctx.restore();
        const undoText = G.phase === 'title' || G.phase === 'howto' ? 'UNDO: ' + START_UNDOS : 'UNDO: ' + G.undos + (G.undos === 1 ? ' (LAST)' : '');
        ctx.save();
        ctx.beginPath();
        ctx.rect(WIN_W - 300, sy - 2, 172, STATUS_H - 6);
        ctx.clip();
        text(ctx, undoText, WIN_W - 296, sy, 2, G.undos === 1 && G.phase === 'playing' && (Math.floor(tNow / 300) & 1) ? DARK : BLACK);
        ctx.restore();
        text(ctx, PLAY_W + ' x ' + PLAY_H, WIN_W - 118, sy, 2, BLACK);
        // the image
        ctx.save();
        ctx.translate(PLAY_X, PLAY_Y);
        ctx.beginPath();
        ctx.rect(0, 0, PLAY_W, PLAY_H);
        ctx.clip();
        ctx.fillStyle = WHITE;
        ctx.fillRect(0, 0, PLAY_W, PLAY_H);
        if (G.phase === 'title')
            drawTitle(ctx);
        else if (G.phase === 'howto')
            drawHowto(ctx);
        else {
            for (const it of G.items)
                drawItem(ctx, it);
            drawHUD(ctx);
            drawFloaters(ctx);
            drawPortrait(ctx, tNow);
            drawBanner(ctx);
            if (G.paused && G.phase === 'playing') {
                ctx.fillStyle = WHITE;
                ctx.fillRect(PLAY_W / 2 - 90, 240, 180, 60);
                ctx.fillStyle = BLACK;
                ctx.fillRect(PLAY_W / 2 - 90, 240, 180, 2);
                ctx.fillRect(PLAY_W / 2 - 90, 298, 180, 2);
                ctx.fillRect(PLAY_W / 2 - 90, 240, 2, 60);
                ctx.fillRect(PLAY_W / 2 + 88, 240, 2, 60);
                text(ctx, 'PAUSED', PLAY_W / 2, 252, 3, BLACK, 'center');
                text(ctx, 'P to continue', PLAY_W / 2, 278, 2, DARK, 'center');
            }
            if (G.phase === 'over' || G.phase === 'won')
                drawEndDialog(ctx);
        }
        drawAchievement(ctx); // toasts show on every screen; some achievements come from the title
        if (achOpen)
            drawAchDialog(ctx);
        ctx.restore();
    }
    // ============================================================================
    //  Input
    // ============================================================================
    function toLogical(e) {
        const r = canvas.getBoundingClientRect();
        return { x: (e.clientX - r.left) * WIN_W / r.width, y: (e.clientY - r.top) * WIN_H / r.height };
    }
    function hitButton(x, y) {
        const px = x - PLAY_X, py = y - PLAY_Y;
        for (const b of buttons)
            if (px >= b.x && px < b.x + b.w && py >= b.y && py < b.y + b.h)
                return b;
        return null;
    }
    function onButton(id) {
        switch (id) {
            case 'begin':
                startRun();
                break;
            case 'achclose':
                achOpen = false;
                break;
            case 'restart':
                startRun();
                break;
            case 'restore':
                if (restoreArmed > performance.now()) {
                    restoreArmed = 0;
                    resetProgress();
                    G.phase = 'title';
                    G.items = [];
                } // and back to the title, like a fresh install
                else {
                    restoreArmed = performance.now() + 5000;
                    SFX.undo();
                    setStatus('Clears records and the photo. Click again.', 5);
                }
                break;
            case 'quit':
                SFX.click();
                G.phase = 'title';
                G.items = [];
                setStatus('Quit to where?', 4);
                break;
        }
    }
    function chromeClick(x, y) {
        if (y >= FRAME + TITLE_H && y < FRAME + TITLE_H + MENU_H) {
            for (const m of menuRects)
                if (x >= m.x && x < m.x + m.w) {
                    if (m.label === 'Sound') {
                        setSound(!soundOn);
                        if (soundOn)
                            SFX.click();
                    }
                    else if (m.label === 'Help') {
                        if (G.phase === 'playing') {
                            G.paused = true;
                            setStatus('Help: wreaths go on the head. Paused.', 4);
                        }
                        else if (G.phase === 'title')
                            G.phase = 'howto';
                        else
                            setStatus('Help: wreaths go on the head.', 4);
                    }
                    else if (m.label === 'Edit')
                        setStatus('Undo  Ctrl+Z    (Nothing to undo.)', 4);
                    else if (m.label === 'File')
                        setStatus('Save As...  untitled.bmp  (It will not save.)', 4);
                    else if (m.label === 'Image')
                        setStatus('Invert Colors: still gray.', 4);
                    else if (m.label === 'View')
                        setStatus('View: this is the view.', 4);
                    else if (m.label === 'Achievements') {
                        achOpen = true;
                        if (G.phase === 'playing')
                            G.paused = true;
                        SFX.click();
                    }
                    else
                        setStatus('Options: there are no options. It is 1995.', 4);
                    return true;
                }
        }
        if (y >= PALETTE_Y && y < STATUS_Y) {
            for (const p of paletteRects)
                if (x >= p.x && x < p.x + 16 && y >= p.y && y < p.y + 16) {
                    SFX.click();
                    unlock('palette');
                    setStatus('They are all gray.', 4);
                    return true;
                }
            if (x < FRAME + 40) {
                setStatus('Foreground: black. Background: white. Correct.', 4);
                return true;
            }
        }
        if (x < PLAY_X - PAD && y > FRAME + TITLE_H + MENU_H && y < PALETTE_Y) {
            // the toolbox: a 2 x 8 grid of 25 px buttons on a 26 px pitch (see the toolbar drawing)
            const tx = FRAME + 4, ty = FRAME + TITLE_H + MENU_H + 4;
            const col = Math.floor((x - tx) / 26), row = Math.floor((y - ty) / 26);
            if (col >= 0 && col < 2 && row >= 0 && row < 8 && (x - tx) % 26 < 25 && (y - ty) % 26 < 25) {
                const i = row * 2 + col, msg = TOOL_MSGS[i];
                if (msg) {
                    G.toolPress = i;
                    G.toolPressUntil = performance.now() + 160;
                    SFX.click();
                    setStatus(msg, 4);
                    toolsFound.add(i);
                    if (toolsFound.size >= TOOLS_TO_FIND)
                        unlock('tools');
                }
            }
            return true; // every other tool, and the options box, does nothing. No movement, no message.
        }
        return false;
    }
    canvas.addEventListener('mousemove', e => {
        const { x, y } = toLogical(e);
        G.mouseX = x - PLAY_X;
        G.mouseY = y - PLAY_Y;
        const b = hitButton(x, y);
        G.hover = b ? b.id : null;
        if (G.phase === 'playing' && !G.bot) {
            G.usingKeys = false;
            G.targetX = G.mouseX - HEAD_CX * portrait.width;
        }
    });
    canvas.addEventListener('mousedown', e => {
        if (e.button !== 0)
            return;
        ensureAudio();
        const { x, y } = toLogical(e);
        const b = hitButton(x, y);
        if (b) {
            onButton(b.id);
            G.hover = null;
            return;
        }
        if (achOpen) {
            achOpen = false;
            return;
        } // any click outside its button closes the Achievements dialog
        if (chromeClick(x, y))
            return;
        if (G.phase === 'title')
            G.phase = 'howto';
        else if (G.phase === 'howto')
            startRun();
        else if (G.phase === 'playing' && G.paused)
            G.paused = false;
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('keydown', e => {
        const k = e.key;
        ensureAudio();
        if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z')) {
            e.preventDefault();
            SFX.undo();
            setStatus('Nothing to undo.', 3);
            return;
        }
        if (!e.ctrlKey && !e.metaKey && !e.altKey && (k === 'm' || k === 'M')) {
            setSound(!soundOn);
            if (soundOn)
                SFX.click();
            return;
        }
        if ((e.ctrlKey || e.metaKey) && (k === 's' || k === 'S')) {
            e.preventDefault();
            setStatus('Saved as untitled.bmp. (It was not.)', 4);
            return;
        }
        if (e.ctrlKey || e.metaKey || e.altKey)
            return;
        if (achOpen && (k === 'Escape' || k === ' ' || k === 'Enter')) {
            achOpen = false;
            SFX.click();
            e.preventDefault();
            return;
        }
        if (k === 'ArrowLeft' || k === 'a' || k === 'A') {
            G.keys.left = true;
            e.preventDefault();
        }
        if (k === 'ArrowRight' || k === 'd' || k === 'D') {
            G.keys.right = true;
            e.preventDefault();
        }
        if (k === ' ' || k === 'Enter') {
            e.preventDefault();
            if (G.phase === 'title')
                G.phase = 'howto';
            else if (G.phase === 'howto')
                startRun();
            else if (G.phase === 'over' || G.phase === 'won')
                startRun();
            else if (G.phase === 'playing' && G.paused)
                G.paused = false;
        }
        if ((k === 'p' || k === 'P' || k === 'Escape') && G.phase === 'playing') {
            G.paused = !G.paused;
            SFX.click();
            e.preventDefault();
        }
    });
    window.addEventListener('keyup', e => {
        const k = e.key;
        if (k === 'ArrowLeft' || k === 'a' || k === 'A')
            G.keys.left = false;
        if (k === 'ArrowRight' || k === 'd' || k === 'D')
            G.keys.right = false;
    });
    window.addEventListener('blur', () => { if (G.phase === 'playing')
        G.paused = true; G.keys.left = G.keys.right = false; });
    // ============================================================================
    //  Boot
    // ============================================================================
    function fit() {
        const s = Math.min((window.innerWidth - 8) / WIN_W, (window.innerHeight - 8) / WIN_H);
        canvas.style.width = Math.floor(WIN_W * s) + 'px';
        canvas.style.height = Math.floor(WIN_H * s) + 'px';
    }
    window.addEventListener('resize', fit);
    let last = 0;
    function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000 || 0);
        last = now;
        update(dt);
        musicTick();
        render(now);
        requestAnimationFrame(frame);
    }
    const img = new Image();
    img.onload = () => {
        const pw = Math.round(CROP.w * PORTRAIT_H / CROP.h);
        portrait = resample(img, CROP.x, CROP.y, CROP.w, CROP.h, pw, PORTRAIT_H);
        titleArt = resample(img, 0, 0, img.naturalWidth, img.naturalHeight, PLAY_W, Math.round(img.naturalHeight * PLAY_W / img.naturalWidth));
        buildChrome();
        G.px = (PLAY_W - portrait.width) / 2;
        G.targetX = G.px;
        fit();
        if (location.hash === '#bot')
            G.bot = true;
        if (location.hash === '#debug' || location.hash === '#bot')
            window.__wq = { G, startRun, update, KINDS, audio: () => ({ state: ac ? ac.state : 'none', notes: notesScheduled, mode: music.mode, soundOn, master: ac ? masterGain.gain.value : -1 }), scheduleStep, notes: () => notesScheduled };
        requestAnimationFrame(frame);
    };
    img.src = window.__WQ_ART__;
    const photoImg = new Image(); // loads in the background; nothing waits on it
    photoImg.onload = () => { photo = photoImg; };
    photoImg.src = window.__WQ_PHOTO__;
})();

</script>
</body>
